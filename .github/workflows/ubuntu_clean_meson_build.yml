name: "Build Test - Ubuntu Meson"

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  meson_test:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
        # The third entry builds and RUNS the whole suite with _FP16 bound to
        # the uint16 nntrainer::Half wrapper instead of native _Float16. It is
        # the only leg that can catch a change using an _FP16 operation Half
        # does not provide, or one leaning on native promotion where Half
        # differs: the MSVC job that selects the wrapper for real is
        # compile-and-link only, and unittest_half_fp16 exercises Half in
        # isolation rather than the tree's thousands of _FP16 uses.
        meson_options: [ "-Denable-fp16=false", "-Denable-fp16=true", "-Denable-fp16=true -Dfp16-impl=wrapper" ]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check if rebuild required
      uses: ./.github/actions/check-rebuild
    - name: Set up Python 3.10
      if: env.rebuild == '1'
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: install additional package from PPA for testing
      if: env.rebuild == '1'
      run: sudo add-apt-repository -y ppa:nnstreamer/ppa && sudo apt-get update
    - name: install minimal requirements
      if: env.rebuild == '1'
      run: sudo apt-get update && sudo apt-get install -y gcc g++ pkg-config libopenblas-dev libiniparser-dev libjsoncpp-dev libcurl3-dev tensorflow2-lite-dev nnstreamer-dev libglib2.0-dev libgstreamer1.0-dev libgtest-dev ml-api-common-dev flatbuffers-compiler ml-inference-api-dev libunwind-dev
    - name: install additional packages for features
      if: env.rebuild == '1'
      run: sudo apt-get install -y python3-dev python3-numpy python3
    - name: gcc version change
      if: env.rebuild == '1'
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
        sudo apt-get update
        sudo apt-get install -y --fix-broken build-essential
        sudo apt-get install -y gcc-13 g++-13 libcc1-0 libgcc-13-dev
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 1000
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 1000
        sudo update-alternatives --set gcc /usr/bin/gcc-13
    - name: Install submodules
      if: env.rebuild == '1'
      run: git submodule sync && git submodule update --init --recursive
    - name: install build systems
      if: env.rebuild == '1'
      run: sudo apt install meson ninja-build
    - if: env.rebuild == '1'
      run: |
        causallm_option="-Denable-transformer=false"
        if [ "${{ matrix.meson_options }}" = "-Denable-fp16=false" ]; then
          causallm_option="-Denable-transformer=true"
        fi

        meson \
          --buildtype=plain \
          --prefix=/usr \
          --sysconfdir=/etc \
          --libdir=lib/x86_64-linux-gnu \
          --bindir=lib/nntrainer/bin \
          --includedir=include \
          -Dinstall-app=true \
          ${causallm_option} \
          -Dreduce-tolerance=false \
          -Denable-debug=true \
          -Dml-api-support=enabled \
          -Denable-nnstreamer-tensor-filter=enabled \
          -Denable-nnstreamer-tensor-trainer=enabled \
          -Denable-nnstreamer-backbone=true \
          -Dcapi-ml-common-actual=capi-ml-common \
          -Dcapi-ml-inference-actual=capi-ml-inference \
          -Denable-capi=enabled \
          ${{ matrix.meson_options }} \
          build
    - name: Check CausalLM model tests are enabled
      if: ${{ matrix.meson_options == '-Denable-fp16=false' && env.rebuild == '1' }}
      run: |
        meson introspect build --tests > meson-tests.json
        python3 - <<'PY'
        import json

        with open("meson-tests.json", encoding="utf-8") as test_file:
            tests = {test["name"] for test in json.load(test_file)}

        required_tests = {
            "unittest_causallm_models",
        }
        missing_tests = sorted(required_tests - tests)
        if missing_tests:
            raise SystemExit(
                "Missing CausalLM Meson tests: " + ", ".join(missing_tests)
            )

        print("CausalLM Meson model tests enabled: " + ", ".join(sorted(required_tests)))
        PY
    - if: env.rebuild == '1'
      run: ninja -C build
    - name: run App Tests
      if: env.rebuild == '1'
      run: meson test -C build --no-suite unittests --print-errorlogs
    - name: run Unittests
      if: env.rebuild == '1'
      run: meson test -C build --suite unittests --print-errorlogs
