name: "Tizen ARM"

on:
  schedule:
    # 04:30 AM (KST) Mon-Fri
    - cron: "30 19 * * 0-4"
  workflow_dispatch:

jobs:
  build:
    name: Tizen GBS build on Ubuntu (ARM)
    strategy:
      matrix:
        include:
          - gbs_build_arch: "armv7l"
            gbs_build_option: "--define \"unit_test 0\""
          - gbs_build_arch: "aarch64"
            gbs_build_option: "--define \"unit_test 0\""

    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write # evict stale gbs cache snapshots

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v1

    - name: prepare GBS
      run: |
        echo "deb [trusted=yes] http://download.tizen.org/tools/latest-release/Ubuntu_22.04/ /" | sudo tee /etc/apt/sources.list.d/tizen.list
        sudo apt-get update && sudo apt-get install -y gbs
        cp .github/workflows/tizen.gbs.conf ~/.gbs.conf

    - name: get date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: restore gbs RPM cache from main branch
      uses: actions/cache/restore@v4
      with:
        path: ~/GBS-ROOT/local/cache
        key: gbs-cache-${{ matrix.gbs_build_arch }}-${{ steps.get-date.outputs.date }}
        restore-keys: |
          gbs-cache-${{ matrix.gbs_build_arch }}-

    - name: restore gbs ccache from main branch
      uses: actions/cache/restore@v4
      with:
        path: ~/gbs-ccache
        key: gbs-ccache-${{ matrix.gbs_build_arch }}-${{ steps.get-date.outputs.date }}
        restore-keys: |
          gbs-ccache-${{ matrix.gbs_build_arch }}-

    - name: run GBS
      # --pkg-ccache seeds the build root's ccache from the restored tar (skipped if absent).
      # --clean makes build evict the entries this build did not hit, so the cache stays one build's worth.
      run: |
        gbs build --skip-srcrpm --define "_skip_debug_rpm 1" -A ${{ matrix.gbs_build_arch }} ${{ matrix.gbs_build_option }} --clean --pkg-ccache "$HOME/gbs-ccache/ccache.tar"

    - name: prune gbs RPM cache
      # RPM cache includes packages which are necessary for gbs build.
      # When these packages are newly updated, actions/cache/save saves both old and new packages which causes
      # RPM cache size explosion.
      # By running pruning script, let's save newest packages only.
      run: bash .github/workflows/gbs-cache-prune.sh

    - name: save gbs RPM cache
      uses: actions/cache/save@v4
      with:
        path: ~/GBS-ROOT/local/cache
        key: gbs-cache-${{ matrix.gbs_build_arch }}-${{ steps.get-date.outputs.date }}

    - name: evict stale gbs RPM cache
      # PRs restore only the newest snapshot, so older date-keyed ones are dead weight.
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/workflows/gbs-cache-evict.sh gbs-cache-${{ matrix.gbs_build_arch }}- gbs-cache-${{ matrix.gbs_build_arch }}-${{ steps.get-date.outputs.date }}

    - name: collect gbs ccache
      id: collect-ccache
      # build packs the ccache into OTHER/_ccache.tar of the build root on exit
      run: |
        tar=~/GBS-ROOT/local/BUILD-ROOTS/scratch.${{ matrix.gbs_build_arch }}.0/home/abuild/rpmbuild/OTHER/_ccache.tar
        if ! sudo test -f "$tar"; then
          echo "::warning::gbs ccache: $tar not found, skipping ccache save"
          exit 0
        fi
        mkdir -p ~/gbs-ccache
        sudo mv "$tar" ~/gbs-ccache/ccache.tar
        sudo chown "$(id -u):$(id -g)" ~/gbs-ccache/ccache.tar
        ls -l ~/gbs-ccache
        echo "found=true" >> "$GITHUB_OUTPUT"

    - name: save gbs ccache
      if: steps.collect-ccache.outputs.found == 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/gbs-ccache
        key: gbs-ccache-${{ matrix.gbs_build_arch }}-${{ steps.get-date.outputs.date }}

    - name: evict stale gbs ccache
      if: steps.collect-ccache.outputs.found == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/workflows/gbs-cache-evict.sh gbs-ccache-${{ matrix.gbs_build_arch }}- gbs-ccache-${{ matrix.gbs_build_arch }}-${{ steps.get-date.outputs.date }}

    # Disabled: nnstreamer/api/mlagent tests are unstable on Tizen CI
    # - name: get ML API
    # - name: get ML Agent
    # - name: get NNStreamer
    # - name: build and test nnstreamer ml-api and ml-agent
