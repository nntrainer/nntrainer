name: Workbench engine tests

# Unit tests of the AI Compiler Workbench's Python engine (tools/agentic-ai-workbench).
# They need only the Python standard library: the tests that use torch, transformers
# or a running Docker skip themselves when those are not installed.

on:
  pull_request:
    paths:
      - "tools/agentic-ai-workbench/**"
      - ".github/workflows/workbench_engine_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  engine_tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # the oldest Python the workbench supports, and the one its setup guide recommends
        python-version: [ "3.10", "3.12" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the engine tests
        working-directory: tools/agentic-ai-workbench/extension/engine
        run: python -B tests/run_all.py
