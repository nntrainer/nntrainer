name: "Build Test - Ubuntu arm64 (packaging ISA)"

## The arm64 PPA package is built for a baseline ISA (see debian/rules), which
## no other PR job covers: pdebuild runs amd64 only, the Tizen aarch64 matrix
## builds without unit tests, and the cross build never runs them. Kernels
## selected at compile time therefore used to reach the PPA builders untested
## and abort there (SIGILL / SIGSEGV). This job builds with the same ISA as the
## package and runs the unit tests on a native arm64 runner.
##
## The architecture specific half of the packaging was not covered either: the
## ARM backend installs its own set of headers, which debian/rules has to hand
## to dh_install, or dh_install / dh_missing fail on the builders. So the job
## also installs into debian/tmp and runs the dh_install of debian/rules and
## dh_missing on it. That costs seconds, while a full dpkg-buildpackage would
## more than double the job; the packages this configuration does not build
## (ML API, NNStreamer and applications) are left out with -N. And because the
## runner implements i8mm, the shipped libraries are also checked for i8mm
## instructions, which would otherwise only trap on the builders.
##
## Noble with the archive default compiler, which is what the noble PPA build
## uses. iniparser comes from ppa:nnstreamer/ppa: the archive package installs
## no pkg-config file, so meson would fall back to the CMake subproject, whose
## include directory does not exist at compile time.

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  arm64_packaging_isa:
    name: Ubuntu arm64 build & test with the packaging ISA
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check if rebuild required
      uses: ./.github/actions/check-rebuild
      with:
        mode: debian
    - name: install additional package from PPA for testing
      if: env.rebuild == '1'
      run: sudo add-apt-repository -y ppa:nnstreamer/ppa && sudo apt-get update
    - name: install minimal requirements
      if: env.rebuild == '1'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ pkg-config meson ninja-build \
          libopenblas-dev libiniparser-dev libjsoncpp-dev libgtest-dev \
          libgmock-dev libglib2.0-dev python3-dev python3-numpy \
          debhelper
    - name: report the ISA of the runner
      if: env.rebuild == '1'
      run: grep -m1 Features /proc/cpuinfo
    - name: meson configure
      if: env.rebuild == '1'
      ## -Darm-march has to stay in sync with debian/rules
      run: |
        meson \
          --buildtype=plain \
          --prefix=/usr \
          --sysconfdir=/etc \
          --libdir=lib/aarch64-linux-gnu \
          --bindir=lib/nntrainer/bin \
          --includedir=include \
          -Darm-march=armv8.2-a+dotprod \
          -Dreduce-tolerance=true \
          -Denable-debug=false \
          -Denable-app=false \
          -Dinstall-app=false \
          -Denable-tflite-interpreter=false \
          -Denable-tflite-backbone=false \
          build
    - if: env.rebuild == '1'
      run: ninja -C build
    - name: run Unittests
      if: env.rebuild == '1'
      run: meson test -C build --suite unittests --print-errorlogs
    - name: install into debian/tmp
      if: env.rebuild == '1'
      run: DESTDIR=$(pwd)/debian/tmp ninja -C build install
    - name: check that no i8mm instruction is shipped
      if: env.rebuild == '1'
      ## The runner implements i8mm, so an unguarded i8mm instruction passes
      ## the unit tests here and only traps on the builders. objdump decodes
      ## the hand encoded .inst words as well.
      ## Shared libraries only: the static ones are built from the same sources
      ## with the same flags, and disassembling libnntrainer.a takes ~30 min.
      run: |
        libs=$(find debian/tmp -name '*.so*' -type f)
        [ -n "$libs" ] || { echo "no library installed"; exit 1; }
        found=0
        for lib in $libs; do
          ## a failing objdump stops the step instead of reading as clean
          objdump -d "$lib" > "$RUNNER_TEMP/disasm.txt"
          n=$(grep -cE '\s(smmla|ummla|usmmla|usdot|sudot)\s' "$RUNNER_TEMP/disasm.txt" || true)
          echo "$lib: $n i8mm instructions"
          [ "$n" = "0" ] || found=1
        done
        exit $found
    - name: run dh_install of debian/rules and dh_missing
      if: env.rebuild == '1'
      ## Leave out every binary package this configuration does not build
      ## (ML API, NNStreamer, applications), including ones added later.
      run: |
        DH_OPTIONS=$(dh_listpackages | grep -vxE 'nntrainer|nntrainer-dev|ccapi-ml-training|ccapi-ml-training-dev' | sed 's/^/-N/' | tr '\n' ' ')
        export DH_OPTIONS
        echo "DH_OPTIONS=$DH_OPTIONS"
        debian/rules override_dh_install
        dh_missing --fail-missing
