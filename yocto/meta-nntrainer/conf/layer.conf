# Layer for building nntrainer from this repository with Yocto.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*.bbappend"

BBFILE_COLLECTIONS += "meta-nntrainer"
BBFILE_PATTERN_meta-nntrainer = "^${LAYERDIR}/"
# Higher than meta-neural-network (7) so nntrainer_git.bb wins over its
# nntrainer_0.1.1.bb.
BBFILE_PRIORITY_meta-nntrainer = "8"

LAYERDEPENDS_meta-nntrainer = "core neuralnetwork"
LAYERSERIES_COMPAT_meta-nntrainer = "scarthgap"
