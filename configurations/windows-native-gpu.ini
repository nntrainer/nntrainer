# Native file for a Windows GPU build (OpenCL + CUDA), the counterpart of
# windows-native-fp16.ini for a build that also enables the accelerator
# backends. default_library is deliberately NOT pinned: a machine-file pin
# silently overrides a later `meson configure -Ddefault_library=` on every
# ninja regen, which is hard to see from the build log.
[project options]
enable-tflite-backbone=false
enable-nnstreamer-backbone=false
enable-tflite-interpreter=false
install-app=false
enable-opencl = true
enable-cuda = true
enable-fp16 = true
enable-test = false
enable-blas = false

[built-in options]
werror=false
c_std='c17'
cpp_std='c++20'
platform='windows'
vsenv = true
