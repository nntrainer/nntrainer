[project options]
enable-tflite-backbone=false
enable-nnstreamer-backbone=false
enable-tflite-interpreter=false
install-app=false
enable-opencl = false
enable-fp16 = true
# fp16-impl is left at its default 'auto': the meson probe compiles a native
# _Float16 arithmetic snippet with cl.exe, fails, and selects the uint16-backed
# nntrainer::Half wrapper (-DUSE_HALF_WRAPPER=1). Pinning it here would defeat
# the point of verifying the probe itself.
#
# Compile + link verification only. The unit-test suite has test-only
# portability gaps on MSVC that are out of scope for the fp16 wrapper; the fp32
# Windows job (windows-native.ini) still runs meson test.
enable-test = false

[built-in options]
werror=false
c_std='c17'
cpp_std='c++20'
platform='windows'
vsenv = true
default_library = 'static'
