# Network Section : Network
# 3-layer FC MNIST model for NPU training validation.
# All FC layers tagged engine=cdsp to dispatch GEMMs to Hexagon cDSP.
[Model]
Type = NeuralNetwork
Epochs = 3
Loss = cross
Save_Path = "mnist_3layer_npu.bin"
batch_size = 32

[LearningRateScheduler]
type = constant
Learning_rate = 1e-3

[Optimizer]
Type = adam
beta1 = 0.9
beta2 = 0.999
epsilon = 1e-7

# Layer Section : Name
[inputlayer]
Type = input
Input_Shape = 1:28:28

[flatten]
Type = flatten
input_layers = inputlayer

[fc1]
Type = fully_connected
input_layers = flatten
Unit = 128
weight_initializer = xavier_uniform
bias_initializer = zeros
Activation = relu
engine = cdsp

[fc2]
Type = fully_connected
input_layers = fc1
Unit = 64
weight_initializer = xavier_uniform
bias_initializer = zeros
Activation = relu
engine = cdsp

[outputlayer]
Type = fully_connected
input_layers = fc2
Unit = 10
weight_initializer = xavier_uniform
bias_initializer = zeros
Activation = softmax
engine = cdsp
