# 3-layer FC MNIST model for CPU training (no engine=cdsp) - LARGER MODEL
# Larger hidden layers (512, 256) to match NPU large model for comparison.

[Model]
Type = NeuralNetwork
Epochs = 5
Loss = cross
Save_Path = "mnist_3layer_cpu_large.bin"
batch_size = 64

[LearningRateScheduler]
type = constant
Learning_rate = 1e-3

[Optimizer]
Type = adam
beta1 = 0.9
beta2 = 0.999
epsilon = 1e-7

[inputlayer]
Type = input
Input_Shape = 1:28:28

[flatten]
Type = flatten
input_layers = inputlayer

[fc1]
Type = fully_connected
input_layers = flatten
Unit = 512
weight_initializer = xavier_uniform
bias_initializer = zeros
Activation = relu

[fc2]
Type = fully_connected
input_layers = fc1
Unit = 256
weight_initializer = xavier_uniform
bias_initializer = zeros
Activation = relu

[outputlayer]
Type = fully_connected
input_layers = fc2
Unit = 10
weight_initializer = xavier_uniform
bias_initializer = zeros
Activation = softmax
